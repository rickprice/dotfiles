monitor.alsa.rules = [
  # Bypass UCM/ACP to get a flat 4-channel device instead of the HiFi split nodes.
  # This gives clean AUX0-3 numbered ports and avoids the JACK bridge bug with
  # the Direct profile where playback_FC and monitor_FL are dropped.
  {
    matches = [
      { device.name = "alsa_card.usb-BEHRINGER_UMC404HD_192k-00" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
      }
    }
  }
  # Rename the playback (sink) node and number channels 1-4 via AUX positions
  {
    matches = [
      { node.name = "~alsa_output.*BEHRINGER_UMC404HD.*" }
    ]
    actions = {
      update-props = {
        node.nick        = "UMC404HD"
        node.description = "UMC404HD"
        audio.position   = [ AUX0, AUX1, AUX2, AUX3 ]
      }
    }
  }
  # Rename the capture (source) node and number channels 1-4 via AUX positions
  {
    matches = [
      { node.name = "~alsa_input.*BEHRINGER_UMC404HD.*" }
    ]
    actions = {
      update-props = {
        node.nick        = "UMC404HD"
        node.description = "UMC404HD"
        audio.position   = [ AUX0, AUX1, AUX2, AUX3 ]
      }
    }
  }
]
