context.modules = [
    { name = libpipewire-module-filter-chain
      args = {
          node.description = "UMC404HD Compressed"
          media.name       = "UMC404HD Compressed"
          filter.graph = {
              nodes = [
                  # Stereo compressor — tames variable levels, makeup gain lifts quiet content
                  { type = ladspa  name = comp   plugin = "ZamCompX2-ladspa"
                    label = "ZamCompX2"
                    control = {
                        "Attack"           = 5
                        "Release"          = 150
                        "Knee"             = 6
                        "Ratio"            = 16
                        "Threshold"        = -28
                        "Makeup"           = 8
                        "Slew"             = 1
                        "Stereo Detection" = 1
                        "Sidechain"        = 0
                    }
                  }
                  # Lookahead limiter — hard ceiling at -1 dBFS
                  { type = ladspa  name = limit  plugin = "fast_lookahead_limiter_1913"
                    label = "fastLookaheadLimiter"
                    control = {
                        "Input gain (dB)"  = 0
                        "Limit (dB)"       = -1
                        "Release time (s)" = 0.3
                    }
                  }
              ]
              links = [
                  { output = "comp:Audio Output 1"  input = "limit:Input 1" }
                  { output = "comp:Audio Output 2"  input = "limit:Input 2" }
              ]
              inputs  = [ "comp:Audio Input 1"  "comp:Audio Input 2" ]
              outputs = [ "limit:Output 1"  "limit:Output 2" ]
          }
          capture.props = {
              node.name      = "umc404hd_compressed"
              media.class    = Audio/Sink
              audio.channels = 2
              audio.position = [ FL FR ]
          }
          playback.props = {
              node.name      = "umc404hd_compressed_play"
              audio.channels = 2
              audio.position = [ FL FR ]
              target.object  = "umc404hd_combined"
          }
      }
    }
]
